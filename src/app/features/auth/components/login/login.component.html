<div class="auth-page">
  <button mat-icon-button type="button" class="auth-theme" (click)="theme.toggle()"
          [attr.aria-label]="theme.theme() === 'dark' ? 'Ativar modo claro' : 'Ativar modo escuro'"
          [title]="theme.theme() === 'dark' ? 'Modo claro' : 'Modo escuro'">
    <mat-icon>{{ theme.theme() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>

  <mat-card class="auth-card">
    <div class="auth-brand">
      <img src="assets/favicon.svg" alt="" aria-hidden="true">
      <span>Rotacerta</span>
    </div>

    <h2>Entrar no painel</h2>
    <p class="auth-subtitle">Acesso exclusivo para gestores e gerentes.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <mat-form-field appearance="outline">
        <mat-label>E-mail</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="username" required>
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <mat-error>Informe um e-mail válido.</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Senha</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="current-password" required>
      </mat-form-field>

      @if (errorMessage) {
        <p class="auth-error" role="alert">{{ errorMessage }}</p>
      }

      <button class="auth-submit" type="submit" [disabled]="form.invalid || isSubmitting">
        {{ isSubmitting ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>
  </mat-card>
</div>
