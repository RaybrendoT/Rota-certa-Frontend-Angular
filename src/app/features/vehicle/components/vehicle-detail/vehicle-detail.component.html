<mat-card class="page-card form-card">
  <mat-card-header>
    <mat-card-subtitle>Ônibus ou van da frota e o motorista responsável.</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="form" class="form-grid">
      <mat-form-field>
        <mat-label>Empresa</mat-label>
        <mat-select formControlName="company" required>
          @for (company of companyList; track company.id) {
            <mat-option [value]="company.id">{{ company.name }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Motorista</mat-label>
        <mat-select formControlName="driver" required>
          @for (driver of driverList; track driver.id) {
            <mat-option [value]="driver.id">{{ getDriverLabel(driver) }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Placa</mat-label>
        <input matInput formControlName="plate_number" required>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Modelo</mat-label>
        <input matInput formControlName="model" required>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Capacidade</mat-label>
        <input matInput type="number" formControlName="capacity" required>
      </mat-form-field>

      <mat-checkbox formControlName="is_active">Ativo</mat-checkbox>
    </form>
  </mat-card-content>

  <mat-card-actions class="form-actions">
    <span class="form-hint">* campos obrigatórios</span>
    <button mat-button (click)="cancel()">Cancelar</button>
    <button mat-raised-button color="primary" (click)="save()" [disabled]="form.invalid">
      {{ isEdit ? 'Atualizar' : 'Salvar' }}
    </button>
  </mat-card-actions>
</mat-card>
