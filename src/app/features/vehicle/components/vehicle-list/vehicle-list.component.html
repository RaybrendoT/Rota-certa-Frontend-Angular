<mat-card class="list-card">
  <div class="list-header">
    <button mat-raised-button color="primary" routerLink="novo">
      <mat-icon>add</mat-icon>
      Novo Veículo
    </button>
  </div>

  <div class="table-wrapper">
    <table mat-table [dataSource]="vehicles" class="list-table">
      <ng-container matColumnDef="plate_number">
        <th mat-header-cell *matHeaderCellDef>Placa</th>
        <td mat-cell *matCellDef="let vehicle">{{ vehicle.plate_number }}</td>
      </ng-container>

      <ng-container matColumnDef="model">
        <th mat-header-cell *matHeaderCellDef>Modelo</th>
        <td mat-cell *matCellDef="let vehicle">{{ vehicle.model }}</td>
      </ng-container>

      <ng-container matColumnDef="driver">
        <th mat-header-cell *matHeaderCellDef>Motorista</th>
        <td mat-cell *matCellDef="let vehicle">{{ getDriverLabel(vehicle.driver) }}</td>
      </ng-container>

      <ng-container matColumnDef="capacity">
        <th mat-header-cell *matHeaderCellDef>Capacidade</th>
        <td mat-cell *matCellDef="let vehicle">{{ vehicle.capacity }}</td>
      </ng-container>

      <ng-container matColumnDef="is_active">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let vehicle">{{ vehicle.is_active ? 'Ativo' : 'Inativo' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let vehicle">
          <button mat-icon-button [routerLink]="[vehicle.id, 'editar']">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteVehicle(vehicle.id!)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

  <mat-paginator
    [length]="totalCount"
    [pageIndex]="pageIndex"
    [pageSize]="pageSize"
    [pageSizeOptions]="pageSizeOptions"
    showFirstLastButtons
    (page)="onPageChange($event)">
  </mat-paginator>
</mat-card>
