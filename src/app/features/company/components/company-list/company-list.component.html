<mat-card class="list-card">
  <div class="list-header">
    <button mat-raised-button color="primary" routerLink="novo">
      <mat-icon>add</mat-icon>
      Nova Empresa
    </button>
  </div>

  <table mat-table [dataSource]="companies" class="list-table">

    <!-- Nome -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Nome</th>
      <td mat-cell *matCellDef="let company">{{ company.name }}</td>
    </ng-container>

    <!-- Status -->
    <ng-container matColumnDef="is_active">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let company">
        <span [class.active]="company.is_active" [class.inactive]="!company.is_active">
          {{ company.is_active ? 'Ativo' : 'Inativo' }}
        </span>
      </td>
    </ng-container>

    <!-- Ações -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Ações</th>
      <td mat-cell *matCellDef="let company">
        <button mat-icon-button (click)="manageGestor(company)" title="Definir gestor" aria-label="Definir gestor">
          <mat-icon>manage_accounts</mat-icon>
        </button>
        <button mat-icon-button [routerLink]="[company.id, 'editar']">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteCompany(company.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <p *ngIf="isLoading" class="table-message">Carregando empresas...</p>
  <p *ngIf="!isLoading && errorMessage" class="table-message error">{{ errorMessage }}</p>
  <p *ngIf="!isLoading && !errorMessage && totalCount === 0" class="table-message">
    Nenhuma empresa encontrada.
  </p>

  <mat-paginator
    [length]="totalCount"
    [pageIndex]="pageIndex"
    [pageSize]="pageSize"
    [pageSizeOptions]="pageSizeOptions"
    showFirstLastButtons
    (page)="onPageChange($event)">
  </mat-paginator>
</mat-card>
