<mat-card class="p-6 max-w-2xl mx-auto">
  <mat-card-header>
    <mat-card-title>{{ isEdit ? 'Editar' : 'Novo' }} Funcionário</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="form" class="flex flex-col gap-4 mt-4">

      <mat-form-field>
        <mat-label>Nome</mat-label>
        <input matInput formControlName="name" required>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Empresa</mat-label>
        <input matInput [value]="companyName" disabled>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Telefone</mat-label>
        <input matInput formControlName="phone" required>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Tipo</mat-label>
        <mat-select formControlName="type">
          <mat-option value="EMPLOYEE">Funcionário</mat-option>
          <mat-option value="DRIVER">Motorista</mat-option>
        </mat-select>
      </mat-form-field>

      <!-- Código do Funcionário -->
      <mat-form-field *ngIf="form.get('type')?.value === 'EMPLOYEE'">
        <mat-label>Código do Funcionário</mat-label>
        <input matInput formControlName="employee_code" required>
      </mat-form-field>

      <!-- Número da CNH -->
      <mat-form-field *ngIf="form.get('type')?.value === 'DRIVER'">
        <mat-label>Número da CNH</mat-label>
        <input matInput formControlName="license_number" required>
      </mat-form-field>

      <mat-checkbox formControlName="is_active">Ativo</mat-checkbox>

    </form>
  </mat-card-content>

  <mat-card-actions class="flex justify-end gap-3 mt-4">
    <button mat-button (click)="cancel()">Cancelar</button>
    <button mat-raised-button color="primary" (click)="save()" [disabled]="form.invalid">
      {{ isEdit ? 'Atualizar' : 'Salvar' }}
    </button>
  </mat-card-actions>
</mat-card>
