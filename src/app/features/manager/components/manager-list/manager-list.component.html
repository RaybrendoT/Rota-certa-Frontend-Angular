<mat-card class="list-card">
  <div class="list-header">
    <button mat-raised-button color="primary" routerLink="novo">
      <mat-icon>add</mat-icon>
      Novo Gestor
    </button>
  </div>

  <div class="table-wrapper">
    <table mat-table [dataSource]="managers" class="list-table">

      <!-- Nome -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let manager">{{ manager.name }}</td>
      </ng-container>

      <!-- Empresa -->
      <ng-container matColumnDef="company">
        <th mat-header-cell *matHeaderCellDef>Empresa</th>
        <td mat-cell *matCellDef="let manager">{{ getCompanyLabel(manager) }}</td>
      </ng-container>

      <!-- Telefone -->
      <ng-container matColumnDef="phone">
        <th mat-header-cell *matHeaderCellDef>Telefone</th>
        <td mat-cell *matCellDef="let manager">{{ manager.phone }}</td>
      </ng-container>

      <!-- Matrícula -->
      <ng-container matColumnDef="code">
        <th mat-header-cell *matHeaderCellDef>Matrícula</th>
        <td mat-cell *matCellDef="let manager">{{ manager.employee_code || '-' }}</td>
      </ng-container>

      <!-- Status -->
      <ng-container matColumnDef="is_active">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let manager">
          <span [class.active]="manager.is_active" [class.inactive]="!manager.is_active">
            {{ manager.is_active ? 'Ativo' : 'Inativo' }}
          </span>
        </td>
      </ng-container>

      <!-- Ações -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let manager">
          <button mat-icon-button [routerLink]="[manager.id, 'editar']" title="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="demote(manager)" title="Remover perfil de gestor">
            <mat-icon>person_remove</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

  <p *ngIf="isLoading" class="table-message">Carregando gestores...</p>
  <p *ngIf="!isLoading && errorMessage" class="table-message error">{{ errorMessage }}</p>
  <p *ngIf="!isLoading && !errorMessage && totalCount === 0" class="table-message">
    Nenhum gestor cadastrado ainda.
  </p>

  <mat-paginator
    [length]="totalCount"
    [pageIndex]="pageIndex"
    [pageSize]="pageSize"
    [pageSizeOptions]="pageSizeOptions"
    showFirstLastButtons
    (page)="onPageChange($event)">
  </mat-paginator>
</mat-card>
