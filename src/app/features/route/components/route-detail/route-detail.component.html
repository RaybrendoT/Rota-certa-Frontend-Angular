<mat-card class="page-card form-card">
  <mat-card-header>
    <mat-card-subtitle>Rota fixa: empresa atendida e veículo que faz o trajeto.</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="form" class="form-grid">
      <mat-form-field class="span-2">
        <mat-label>Nome</mat-label>
        <input matInput formControlName="name" required>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Empresa</mat-label>
        <mat-select formControlName="company" required>
          @for (company of companyList; track company.id) {
            <mat-option [value]="company.id">{{ company.name }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Veículo</mat-label>
        <mat-select formControlName="vehicle" required>
          @for (vehicle of vehicleList; track vehicle.id) {
            <mat-option [value]="vehicle.id">{{ getVehicleLabel(vehicle) }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-checkbox formControlName="is_active">Ativo</mat-checkbox>
    </form>
  </mat-card-content>

  <mat-card-actions class="form-actions">
    <span class="form-hint">* campos obrigatórios</span>
    <button mat-button (click)="cancel()">Cancelar</button>
    <button mat-raised-button color="primary" (click)="save()" [disabled]="form.invalid">
      {{ isEdit ? 'Atualizar' : 'Salvar' }}
    </button>
  </mat-card-actions>
</mat-card>
