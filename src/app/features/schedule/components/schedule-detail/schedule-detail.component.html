<mat-card class="page-card form-card">
  <mat-card-header>
    <mat-card-subtitle>Turno: dias da semana e horário de chegada na empresa.</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="form" class="form-grid">
      <mat-form-field>
        <mat-label>ID da Empresa</mat-label>
        <input matInput type="number" formControlName="company" required>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Dias da semana</mat-label>
        <input matInput formControlName="weekdays" placeholder="MON,TUE,WED,THU,FRI" required>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Hora</mat-label>
        <input matInput type="time" formControlName="time" required>
      </mat-form-field>

      <mat-checkbox formControlName="is_active">Ativo</mat-checkbox>
    </form>
  </mat-card-content>

  <mat-card-actions class="form-actions">
    <span class="form-hint">* campos obrigatórios</span>
    <button mat-button (click)="cancel()">Cancelar</button>
    <button mat-raised-button color="primary" (click)="save()" [disabled]="form.invalid">
      {{ isEdit ? 'Atualizar' : 'Salvar' }}
    </button>
  </mat-card-actions>
</mat-card>
