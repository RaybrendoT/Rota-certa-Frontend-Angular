<mat-dialog-content>
  <strong>{{data?.message }}</strong>
  <p class="mt-3">{{data?.description }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancelar</button>
  <button mat-flat-button [color]="data.confirmLabel ? 'primary' : 'warn'" (click)="onConfirm()">{{ data.confirmLabel || 'Deletar' }}</button>
</mat-dialog-actions>
