server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # config.json é gerado na subida do container; nunca pode ficar em cache.
    location = /assets/config/config.json {
        add_header Cache-Control "no-store";
    }

    # Arquivos com hash no nome podem ser cacheados para sempre.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
